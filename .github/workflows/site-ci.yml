name: Site CI

# 紹介ページと API（site/、Cloudflare Pages）と、店の正本（data/）の確認。設計は issue #172。
on:
  pull_request:
    paths:
      - "site/**"
      - "data/**"
      # サーバーの検索のテストは、アプリと同じ保存した応答（test/fixtures）を使う。
      - "test/fixtures/**"
      - ".github/workflows/site-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 正本から D1 に入れる SQL を作れるか（デプロイと同じ道筋）。
      - run: npm run seed
