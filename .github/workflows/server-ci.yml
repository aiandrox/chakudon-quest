name: Server CI

# 店のデータと検索の API（server/）と、その正本（data/）の確認。設計は issue #172。
on:
  pull_request:
    paths:
      - "server/**"
      - "data/**"
      - ".github/workflows/server-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # 正本から D1 に入れる SQL を作れるか（デプロイと同じ道筋）。
      - run: npm run seed
