# 着丼クエストの紹介ページ（public/）と API（functions/、/api/v1/...）。Cloudflare Pages の1つのプロジェクト。
# 設計は issue #172。公開先は https://ramen-in-cho.aiandrox.com
name = "ramen-in-cho"
compatibility_date = "2025-01-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "chakudon-quest"
# Cloudflare のアカウントを決めたら `wrangler d1 create chakudon-quest` の結果に置き換える。
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
